name: Docker Build and Push to GHCR

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'machine-learning/**'
      - 'openapi/**'
      - 'web/**'
      - 'i18n/**'
      - '.github/workflows/docker-build-push.yml'
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  GHCR_NAMESPACE: ghcr.io/${{ github.repository_owner }}

jobs:
  build-server:
    name: Build and Push immich-server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_NAMESPACE }}/immich-server
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=long,prefix=commit-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DEVICE=cpu
          cache-from: type=gha,scope=immich-server
          cache-to: type=gha,mode=max,scope=immich-server

  build-machine-learning:
    name: Build and Push immich-machine-learning${{ matrix.suffix }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: cpu
            suffix: ''
          - device: cuda
            suffix: -cuda
          - device: openvino
            suffix: -openvino
          - device: rknn
            suffix: -rknn
          # armnn variant requires a linux/arm64 runner or very slow QEMU builds;
          # re-enable on an arm64 runner if needed:
          # - device: armnn
          #   suffix: -armnn
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_NAMESPACE }}/immich-machine-learning${{ matrix.suffix }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=long,prefix=commit-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: machine-learning
          file: machine-learning/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DEVICE=${{ matrix.device }}
          cache-from: type=gha,scope=immich-ml${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=immich-ml${{ matrix.suffix }}
